<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Private LinuxHub system bus.

    A session-type daemon starts system services as the same in-container
    identity while preserving the standard system bus socket used by GNOME,
    UPower, NetworkManager and BlueZ. The socket is private to the container.

    EXTERNAL first, ANONYMOUS only as a fallback. The kernel's peer
    credential is the app's real uid, but the Husk loader answers
    getsockopt(SO_PEERCRED) with the identity the peer itself reports
    (NR_FAKE_UID/GID, root by default), so socket-credential authentication
    now names every client. That matters beyond politeness: polkitd refuses
    to check authorization on behalf of a caller it cannot name, and with
    ANONYMOUS every connection reached it with a pid and no uid. ANONYMOUS
    stays listed so a client whose identity cannot be resolved still
    connects, as it did before.
  -->
  <type>session</type>
  <allow_anonymous/>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <auth>ANONYMOUS</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="signal"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
  </policy>
  <servicedir>/usr/share/dbus-1/system-services</servicedir>
  <servicedir>/usr/local/share/dbus-1/system-services</servicedir>
</busconfig>
