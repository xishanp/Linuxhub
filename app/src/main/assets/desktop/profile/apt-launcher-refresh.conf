// Keep third-party application launchers compatible after every APT operation.
// The helper is idempotent and scans all container users.
DPkg::Post-Invoke { "if [ -x /usr/local/bin/doro-refresh-launchers ]; then /usr/local/bin/doro-refresh-launchers >/tmp/doro-apt-launcher-refresh.log 2>&1 || true; fi"; };
